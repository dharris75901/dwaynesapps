<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Times Table Flash Cards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: friendly, encouraging, classroom-practical
   IDEA: a stack of ruled index flash cards on a bright school folder
   PICTURE: one big flippable index card with the fact, ruled lines and red margin
   COLOUR and TYPE: tomato-red folder ground, white card, blue rules, ink black; Baloo 2 numbers + Nunito
   LAYOUT: modest title, setup chips, then the card large and centred with grade buttons below */
:root{color-scheme:light dark;
--bg:light-dark(#e8412c,#1b1d24);--bg2:light-dark(#d23722,#14161b);
--card:light-dark(#fffdf8,#2a2e39);--ink:light-dark(#1b1b1f,#f3f1ea);--soft:light-dark(#5b5b66,#b9b8c4);
--rule:light-dark(#b9d3f2,#3b4f6e);--margin:light-dark(#f08a7e,#a0483e);
--on:#ffffff;--chip:light-dark(rgba(255,255,255,.18),rgba(255,255,255,.07));
--good:#1f8f4e;--bad:#c62d1b;--sel:light-dark(#ffd23f,#ffd23f)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--on);font:16px/1.5 Nunito,system-ui,sans-serif;overflow-x:clip;min-height:100vh;display:flex;flex-direction:column}
main{width:100%;max-width:760px;margin:0 auto;padding:clamp(20px,4vw,40px) max(4vw,16px) 24px;flex:1}
h1{font:800 clamp(30px,6vw,44px)/1.05 "Baloo 2",sans-serif;margin:0 0 4px;text-wrap:balance}
.sub{margin:0 0 20px;opacity:.9}
.panel{background:var(--bg2);border-radius:18px;padding:16px;margin-bottom:20px}
.tabs{display:flex;gap:6px;background:var(--chip);padding:5px;border-radius:14px;margin-bottom:14px}
.tabs button{flex:1}
button{font:800 16px Nunito,sans-serif;border:0;border-radius:12px;min-height:44px;padding:0 14px;cursor:pointer;color:var(--on);background:var(--chip)}
button:focus-visible{outline:3px solid var(--sel);outline-offset:2px}
.tabs button[aria-pressed=true]{background:var(--card);color:var(--ink)}
.lbl{font-weight:800;margin:0 0 8px;font-size:15px}
.chips{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.chips button{font:800 20px "Baloo 2",sans-serif;padding:0}
.chips button[aria-pressed=true]{background:var(--sel);color:#1b1b1f}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
.row .hint{font-size:14px;opacity:.85}
.go{background:var(--card);color:var(--ink);width:100%;margin-top:14px;font-size:18px;min-height:52px}
.go:disabled{opacity:.5;cursor:not-allowed}
.hide{display:none!important}
/* card */
.stage{perspective:1400px;margin:6px auto 0;max-width:560px}
.flip{position:relative;width:100%;aspect-ratio:5/3;transition:transform .5s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d;cursor:pointer;border-radius:16px}
.flip.on{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;background:var(--card);color:var(--ink);
box-shadow:0 14px 0 -6px rgba(0,0,0,.18),0 22px 40px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;flex-direction:column;overflow:hidden;
background-image:linear-gradient(to right,transparent 46px,var(--margin) 46px,var(--margin) 48px,transparent 48px),repeating-linear-gradient(to bottom,transparent 0 33px,var(--rule) 33px 35px);background-position:0 0,0 28px}
.back{transform:rotateY(180deg)}
.fact{font:800 clamp(56px,15vw,104px)/1 "Baloo 2",sans-serif;letter-spacing:.01em}
.ans{font:800 clamp(64px,18vw,124px)/1 "Baloo 2",sans-serif;color:var(--bad)}
.small{font:700 clamp(18px,4vw,24px) "Baloo 2",sans-serif;color:var(--soft);margin-top:4px}
.tap{position:absolute;bottom:10px;right:16px;font-size:13px;color:var(--soft)}
.prog{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 auto 10px;max-width:560px;font-weight:800}
.bar{height:10px;border-radius:9px;background:var(--chip);overflow:hidden;max-width:560px;margin:0 auto 18px}
.bar i{display:block;height:100%;width:0;background:var(--sel);transition:width .3s}
.grade{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:560px;margin:20px auto 0}
.grade button{min-height:56px;font-size:18px}
.g-bad{background:var(--bad)}.g-good{background:var(--good)}
.flipbtn{grid-column:1/-1;background:var(--card);color:var(--ink)}
.quit{background:transparent;text-decoration:underline;opacity:.9;min-height:36px;padding:0}
/* results */
.res{background:var(--card);color:var(--ink);border-radius:18px;padding:24px;text-align:center}
.big{font:800 clamp(52px,14vw,88px)/1 "Baloo 2",sans-serif}
.res p{margin:6px 0 16px;color:var(--soft)}
.missed{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:0 0 18px}
.missed span{font:800 18px "Baloo 2",sans-serif;background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad);padding:4px 12px;border-radius:10px;white-space:nowrap}
.res .row{justify-content:center}
.res button{background:var(--bg);color:#fff}
footer{text-align:center;font-size:13px;opacity:.85;padding:14px 16px 22px}
@media(max-width:520px){.chips{grid-template-columns:repeat(4,minmax(0,1fr))}.face{background-image:linear-gradient(to right,transparent 26px,var(--margin) 26px,var(--margin) 28px,transparent 28px),repeating-linear-gradient(to bottom,transparent 0 25px,var(--rule) 25px 27px)}}
@media(prefers-reduced-motion:reduce){.flip{transition:none}.bar i{transition:none}}
</style>
</head>
<body>
<main>
  <h1>Times Table Flash Cards</h1>
  <p class="sub">Memorize every fact up to 12 × 12. Tap the card to flip it.</p>

  <section id="setup" class="panel" aria-label="Choose what to practice">
    <div class="tabs" role="group" aria-label="Practice mode">
      <button id="mOrder" aria-pressed="true">In order</button>
      <button id="mMix" aria-pressed="false">Mixed</button>
    </div>

    <div id="orderBox">
      <p class="lbl">Pick one or more tables</p>
      <div class="chips" id="chips"></div>
      <div class="row">
        <button id="allBtn">Select all</button><button id="noneBtn">Clear</button>
        <span class="hint" id="orderHint"></span>
      </div>
    </div>

    <div id="mixBox" class="hide">
      <p class="lbl">Mix all tables up to</p>
      <div class="chips" id="upto"></div>
      <div class="row"><span class="hint" id="mixHint"></span></div>
    </div>

    <button class="go" id="start">Start</button>
  </section>

  <section id="play" class="hide" aria-live="polite">
    <div class="prog"><span id="count">Card 1 of 12</span><span id="score">✓ 0 · ✗ 0</span></div>
    <div class="bar"><i id="fill"></i></div>
    <div class="stage">
      <div class="flip" id="card" role="button" tabindex="0" aria-label="Flip card">
        <div class="face front"><div class="fact" id="q">4 × 3</div><span class="tap">tap to flip</span></div>
        <div class="face back"><div class="ans" id="a">12</div><div class="small" id="qa">4 × 3</div></div>
      </div>
    </div>
    <div class="grade">
      <button class="flipbtn" id="flipBtn">Show answer</button>
      <button class="g-bad hide" id="bad">✗ Missed it</button>
      <button class="g-good hide" id="good">✓ Got it</button>
    </div>
    <div class="row" style="justify-content:center"><button class="quit" id="quit">End and see results</button></div>
  </section>

  <section id="done" class="hide">
    <div class="res">
      <div class="big" id="pct">100%</div>
      <p id="sum"></p>
      <div class="missed" id="missList"></div>
      <div class="row">
        <button id="retryMiss">Practice missed ones</button>
        <button id="again">Same set again</button>
        <button id="home">Change tables</button>
      </div>
    </div>
  </section>
</main>
<footer>© 2026 Dwayne Harris · Created by Dwayne Harris</footer>

<script>
{
const $=id=>document.getElementById(id);
let mode='order', picked=new Set([2]), upTo=6;
let deck=[], i=0, right=0, wrong=0, missed=[], lastSet=[], flipped=false;

try{const s=JSON.parse(localStorage.getItem('ttfc')||'null');if(s){mode=s.mode||mode;picked=new Set(s.picked||[2]);upTo=s.upTo||6}}catch(e){}
const save=()=>{try{localStorage.setItem('ttfc',JSON.stringify({mode,picked:[...picked],upTo}))}catch(e){}};

const nums=[...Array(12)].map((_,k)=>k+1);
function drawSetup(){
  $('chips').innerHTML=nums.map(n=>`<button data-n="${n}" aria-pressed="${picked.has(n)}">${n}</button>`).join('');
  $('upto').innerHTML=nums.map(n=>`<button data-u="${n}" aria-pressed="${n===upTo}">${n}</button>`).join('');
  $('mOrder').setAttribute('aria-pressed',mode==='order');$('mMix').setAttribute('aria-pressed',mode==='mix');
  $('orderBox').classList.toggle('hide',mode!=='order');$('mixBox').classList.toggle('hide',mode!=='mix');
  const p=[...picked].sort((a,b)=>a-b);
  $('orderHint').textContent=p.length?`${p.length*12} cards: ${p.map(n=>n+'×1…'+n+'×12').join(', ')}`:'Pick at least one table';
  $('mixHint').textContent=`${upTo*12} cards, shuffled: tables 1 through ${upTo}, each × 1 to 12`;
  $('start').disabled=mode==='order'&&!p.length;
}
$('chips').addEventListener('click',e=>{const n=+e.target.dataset.n;if(!n)return;picked.has(n)?picked.delete(n):picked.add(n);save();drawSetup()});
$('upto').addEventListener('click',e=>{const n=+e.target.dataset.u;if(!n)return;upTo=n;save();drawSetup()});
$('mOrder').onclick=()=>{mode='order';save();drawSetup()};
$('mMix').onclick=()=>{mode='mix';save();drawSetup()};
$('allBtn').onclick=()=>{picked=new Set(nums);save();drawSetup()};
$('noneBtn').onclick=()=>{picked.clear();save();drawSetup()};

const shuffle=a=>{for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a};
function buildDeck(){
  const out=[];
  if(mode==='order'){[...picked].sort((a,b)=>a-b).forEach(n=>nums.forEach(m=>out.push([n,m])));return out}
  for(let n=1;n<=upTo;n++)nums.forEach(m=>out.push([n,m]));
  return shuffle(out);
}
function begin(cards){
  deck=cards;lastSet=cards.slice();i=0;right=0;wrong=0;missed=[];
  $('setup').classList.add('hide');$('done').classList.add('hide');$('play').classList.remove('hide');
  show();
}
function show(){
  const [a,b]=deck[i];
  setFlip(false);
  $('q').textContent=`${a} × ${b}`;
  $('count').textContent=`Card ${i+1} of ${deck.length}`;
  $('score').textContent=`✓ ${right} · ✗ ${wrong}`;
  $('fill').style.width=(i/deck.length*100)+'%';
}
function setFlip(on){
  if(on&&deck[i]){const [a,b]=deck[i];$('a').textContent=a*b;$('qa').textContent=`${a} × ${b}`}
  flipped=on;$('card').classList.toggle('on',on);
  $('flipBtn').classList.toggle('hide',on);$('bad').classList.toggle('hide',!on);$('good').classList.toggle('hide',!on);
  $('card').setAttribute('aria-label',on?'Answer shown, tap to hide':'Flip card');
}
function grade(ok){
  if(!flipped)return;
  ok?right++:(wrong++,missed.push(deck[i]));
  i++;
  if(i>=deck.length)finish();else{setFlip(false);setTimeout(show,180)}
}
function finish(){
  $('fill').style.width='100%';
  $('play').classList.add('hide');$('done').classList.remove('hide');
  const tot=right+wrong, pct=tot?Math.round(right/tot*100):0;
  $('pct').textContent=pct+'%';
  $('sum').textContent=tot?`${right} right, ${wrong} missed out of ${tot} cards${pct===100?' — perfect!':''}`:'No cards answered yet.';
  $('missList').innerHTML=missed.map(([a,b])=>`<span>${a} × ${b} = ${a*b}</span>`).join('');
  $('retryMiss').classList.toggle('hide',!missed.length);
}
$('start').onclick=()=>begin(buildDeck());
$('card').onclick=()=>setFlip(!flipped);
$('flipBtn').onclick=()=>setFlip(true);
$('good').onclick=()=>grade(true);
$('bad').onclick=()=>grade(false);
$('quit').onclick=finish;
$('retryMiss').onclick=()=>begin(mode==='mix'?shuffle(missed.slice()):missed.slice());
$('again').onclick=()=>begin(mode==='mix'?shuffle(lastSet.slice()):lastSet.slice());
$('home').onclick=()=>{$('done').classList.add('hide');$('setup').classList.remove('hide');drawSetup()};
document.addEventListener('keydown',e=>{
  if($('play').classList.contains('hide'))return;
  if(e.key===' '||e.key==='Enter'){e.preventDefault();setFlip(!flipped)}
  else if(e.key==='ArrowRight'||e.key==='y')grade(true);
  else if(e.key==='ArrowLeft'||e.key==='n')grade(false);
});
drawSetup();
}
</script>
</body>
</html>
