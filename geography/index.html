<style>
/* VOICE: a good school atlas — clear, confident, a little proud of the world
   IDEA: a political atlas: each continent printed in its own map colour
   PICTURE: a gridded globe on the cover; the chapter tiles are the working thing
   COLOUR and TYPE: white paper, deep ocean blue, one atlas colour per continent; Barlow Condensed for map lettering, Source Sans for text
   LAYOUT: cover band, chapter grid, then lesson / countries / quiz inside each chapter */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#0c1620);--ink:light-dark(#14202b,#e8eef3);--mut:light-dark(#5b6975,#9fb0bf);--line:light-dark(#dde4ea,#22313f);--card:light-dark(#f4f7f9,#132230);--sea:light-dark(#0b5f86,#0a3d57);--ok:#1f8a4c;--bad:#c2372d}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Source Sans 3",system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:"Barlow Condensed",sans-serif;line-height:1.05;margin:0;text-wrap:balance}
h1{font-size:clamp(38px,7vw,56px)}h2{font-size:clamp(28px,5vw,40px)}h3{font-size:22px}
.band{padding:clamp(24px,4vw,56px) max(5vw,16px)}.wrap{max-width:1100px;margin:0 auto}
button{font:inherit;cursor:pointer;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 16px}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #f2b705;outline-offset:2px}
.cover{background:var(--sea);color:#fff;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:24px;align-items:center}
.cover p{font-size:17px;max-width:60ch;opacity:.92}
.globe{width:100%;max-width:340px;justify-self:center;aspect-ratio:1}
.globe .spin{animation:sp 40s linear infinite;transform-origin:150px 150px}
@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.globe .spin{animation:none}}
.stats{display:flex;flex-wrap:wrap;gap:10px 28px;margin-top:18px}
.stats b{display:block;font:700 30px "Barlow Condensed",sans-serif}.stats span{font-size:14px;opacity:.85}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.tile{text-align:left;padding:0;overflow:hidden;border:0;background:var(--card);display:flex;flex-direction:column}
.tile .top{background:var(--cc);color:#fff;padding:16px 18px 14px}
.tile .top h3{font-size:28px}.tile .bot{padding:12px 18px 16px;color:var(--mut);font-size:15px}
.tile .bot strong{color:var(--ink)}
.prog{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.pill{font-size:13px;border-radius:99px;padding:2px 10px;background:light-dark(#e7edf1,#1d2e3d);color:var(--ink);white-space:nowrap}
.pill.done{background:var(--ok);color:#fff}
.head{background:var(--cc);color:#fff}
.back{background:transparent;color:inherit;border:1px solid rgba(255,255,255,.5);margin-bottom:14px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.tabs button{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.35)}
.tabs button[aria-pressed=true]{background:#fff;color:#14202b;font-weight:700}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:18px 0 6px}
.facts div{border-top:3px solid var(--cc);padding-top:8px}.facts b{display:block;font:700 24px "Barlow Condensed",sans-serif}
.facts span{font-size:14px;color:var(--mut)}
.sec{margin:26px 0;max-width:760px}.sec h3{color:var(--cc);margin-bottom:6px;filter:brightness(.92)}
.sec ul{padding-left:20px;margin:6px 0}.sec li{margin:5px 0}
.know{background:var(--card);border-radius:12px;padding:16px 18px;max-width:760px}
.cta{background:var(--cc);color:#fff;border:0;font-weight:700}
.search{width:100%;max-width:420px;font:16px inherit;padding:11px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);margin-bottom:14px}
details.c{border-bottom:1px solid var(--line)}
details.c summary{list-style:none;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:12px 4px;cursor:pointer}
details.c summary::-webkit-details-marker{display:none}
details.c summary b{font-size:17px}details.c summary small{color:var(--mut);grid-column:1}
.bar{grid-column:2;grid-row:1/3;align-self:center;width:90px;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--cc)}
.card{display:grid;grid-template-columns:8.5em minmax(0,1fr);gap:6px 14px;padding:4px 4px 16px;font-size:15px}
.card dt{color:var(--mut);font-weight:600}.card dd{margin:0}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.mode{text-align:left;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.mode b{font-size:17px}.mode span{font-size:14px;color:var(--mut)}
.qbox{max-width:720px;margin:0 auto}
.meter{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:10px 0 22px}.meter i{display:block;height:100%;background:var(--cc);transition:width .3s}
.clue{font-size:15px;color:var(--mut);margin:0 0 4px}
.q{font-size:clamp(22px,4vw,28px);font-weight:700;line-height:1.25;margin:0 0 18px}
.opts{display:grid;gap:10px}
.opts button{text-align:left;padding:12px 16px;font-size:17px}
.opts button.right{background:var(--ok);color:#fff;border-color:var(--ok)}
.opts button.wrong{background:var(--bad);color:#fff;border-color:var(--bad)}
.fb{margin-top:18px;padding:14px 16px;border-radius:12px;background:var(--card)}
.fb .card{padding:8px 0 0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px}
.big{font:700 clamp(56px,12vw,88px) "Barlow Condensed",sans-serif;color:var(--cc);line-height:1}
.miss{margin:6px 0;padding:10px 0;border-bottom:1px solid var(--line)}
.note{font-size:13px;color:var(--mut)}
.mapbox{position:relative;background:light-dark(#d6eaf4,#0a2433);border-radius:14px;overflow:hidden;aspect-ratio:16/10;margin-bottom:16px;border:1px solid var(--line)}
.mapbox svg{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.mapbox path{fill:light-dark(#c9d1d8,#33434f);stroke:light-dark(#ffffff,#0a2433);stroke-width:.6;vector-effect:non-scaling-stroke}
.mapbox path.in{fill:var(--cc);fill-opacity:.5}
.mapbox path.sel{fill:var(--cc);fill-opacity:1}
.mapbox path.hi{fill:#f2b705;fill-opacity:1}
.mapbox path.ok{fill:var(--ok);fill-opacity:1}.mapbox path.no{fill:var(--bad);fill-opacity:1}
.mapbox .ring{fill:none;stroke:#f2b705;stroke-width:3;vector-effect:non-scaling-stroke}
.zoom{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:44px;height:44px;padding:0;font-size:22px;line-height:1;background:var(--bg);box-shadow:0 1px 4px rgba(0,0,0,.2)}
.maphelp{position:absolute;left:10px;bottom:8px;font-size:13px;background:var(--bg);padding:2px 8px;border-radius:6px;opacity:.9}
.msg{display:grid;place-items:center;height:100%;padding:20px;text-align:center;color:var(--mut)}
.homeb{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.45);margin-top:18px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:16px;z-index:20}
.modal>div{background:var(--bg);color:var(--ink);border-radius:16px;max-width:540px;width:100%;padding:22px;max-height:90vh;overflow:auto}
.modal h3{margin:18px 0 6px}.modal ol{padding-left:22px;margin:6px 0}.modal li{margin:6px 0}
.linkish{background:none;border:0;color:inherit;text-decoration:underline;min-height:44px;padding:0 6px}
.em-band{background:#2b4a3a;color:#fff}
.spec{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;margin:20px 0 6px}
.spec a{display:block;text-decoration:none;color:#fff;padding:12px 8px;border-radius:8px;font-weight:700;font-size:14px;line-height:1.2;text-align:center;min-height:56px}
.spec-ax{display:flex;justify-content:space-between;font-size:13px;opacity:.85;gap:8px}
.mcard{border:1px solid var(--line);border-radius:14px;padding:18px 18px 8px;margin:18px 0;border-top:6px solid var(--mc)}
.mcard h3{font-size:28px;margin-bottom:2px}.mcard .aka{color:var(--mut);font-size:15px;margin:0 0 10px}
.mcard h4{margin:14px 0 4px;font-size:16px}.mcard ul{margin:4px 0;padding-left:20px}.mcard li{margin:4px 0}
.two2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.pill2{display:inline-block;background:var(--card);border-radius:99px;padding:3px 10px;margin:3px 4px 3px 0;font-size:14px}
table.cmp{border-collapse:collapse;width:100%;font-size:15px}table.cmp th,table.cmp td{border-bottom:1px solid var(--line);padding:9px 8px;text-align:left;vertical-align:top}
.tl{border-left:3px solid #2b4a3a;margin:10px 0 0 6px;padding-left:16px}.tl p{margin:0 0 12px}.tl b{display:block}
@media(max-width:600px){.two2{grid-template-columns:1fr}.spec{grid-template-columns:1fr}.spec a{min-height:0;text-align:left}.spec-ax{display:none}}
footer{text-align:center;font-size:13px;color:var(--mut);padding:28px 16px 36px;border-top:1px solid var(--line)}
@media(max-width:600px){.cover{grid-template-columns:1fr}.globe{max-width:200px;grid-row:1}.card{grid-template-columns:1fr;gap:0}.card dd{margin-bottom:8px}}
</style>
</head>

['Land & landmarks',['The 5th-largest continent, almost entirely under an ice sheet averaging about 1.9 km thick.','It holds about 90% of the world’s ice and roughly 70% of its fresh water.','The Transantarctic Mountains split East and West Antarctica; Vinson Massif (4,892 m) is the highest peak.','Technically the world’s largest desert — very little snow falls on the interior.','Lake Vostok lies under nearly 4 km of ice; −89.2 °C was recorded at Vostok Station in 1983.']],

const WILD={
africa:['Africa has the greatest variety of large mammals on Earth, including the “Big Five”: lion, leopard, elephant, rhino and buffalo.','Each year about 1.5 million wildebeest, plus zebras and gazelles, circle between Tanzania’s Serengeti and Kenya’s Maasai Mara — the Great Migration.','Great apes — gorillas, chimpanzees and bonobos — live in the central and western rainforests.','Madagascar split from Africa about 88 million years ago; its lemurs and most of its wildlife live nowhere else.','Desert specialists such as the fennec fox, addax and camel survive the Sahara.','Poaching for ivory and rhino horn is the biggest threat; parks and anti-poaching patrols protect key herds.'],
asia:['Asia is home to tigers (India has most of the wild ones), giant pandas, snow leopards and Asian elephants, which have smaller ears than African elephants.','Indonesia alone has Komodo dragons, orangutans and Sumatran rhinos; the “Coral Triangle” around it has the richest reefs on Earth.','India’s Gir Forest holds the only wild Asiatic lions.','The Arabian oryx was extinct in the wild by 1972 and was brought back through breeding in Oman, Saudi Arabia, Jordan and the UAE.','Many species are endangered by habitat loss and the illegal wildlife trade.'],
europe:['Europe has fewer large animals than other continents, but many are returning: wolves, lynx, beavers and European bison are recovering.','The European bison is the continent’s heaviest land animal; it survived in Białowieża Forest on the Poland–Belarus border.','Hundreds of millions of birds migrate through Europe each year; white storks nest on rooftops from Spain to Poland.','The far north has reindeer, moose and arctic foxes; coasts have seals, puffins and orcas.','The Iberian lynx, once the world’s most endangered cat, has grown from under 100 in 2002 to more than 2,000.'],
'north-america':['North America’s big mammals include bison, grizzly and black bears, moose, elk, caribou and, in the Arctic, polar bears.','The bald eagle, near extinction in the 1960s because of the pesticide DDT, recovered after it was banned.','Monarch butterflies fly up to 4,800 km from Canada and the US to winter in Mexico’s mountains.','Central America is a land bridge where species from both continents meet: jaguars, sloths, toucans and quetzals.','Caribbean islands have unique animals such as Cuba’s bee hummingbird, the world’s smallest bird.'],
'south-america':['The Amazon rainforest holds roughly one in ten of the world’s known species.','Jaguars, the largest cats in the Americas, range from Mexico to Argentina.','The Andes are home to the camel family’s South American relatives: llamas, alpacas, vicuñas and guanacos — and the huge Andean condor.','Ecuador’s Galápagos Islands, with giant tortoises and finches, inspired Charles Darwin’s theory of evolution.','Brazil’s Pantanal, the world’s largest tropical wetland, is one of the best places to see jaguars and capybaras.'],
oceania:['Australia’s long isolation produced marsupials (kangaroos, koalas, wombats) and monotremes — the egg-laying platypus and echidna.','New Zealand had no native land mammals except bats, so birds such as the kiwi and the extinct moa became ground-dwellers.','The Great Barrier Reef supports about 1,500 fish species, turtles, dugongs and whales.','Papua New Guinea’s rainforests hold birds-of-paradise, cassowaries and tree kangaroos.','Introduced animals such as rabbits, foxes and cane toads have badly hurt native wildlife.'],
antarctica:['Antarctica’s animals depend on the sea: penguins, seals and whales all feed on fish, squid and tiny shrimp-like krill.','Emperor penguins, the largest penguins, breed through the winter on the sea ice.','Seals include Weddell, leopard, crabeater and elephant seals.','There are no polar bears — they live only in the Arctic — and no land mammals at all.']

europe:[GDPN,'Europe is the richest continent per person on average, with strong welfare states that provide health care, pensions and unemployment pay.','The richest per person are tiny states and finance hubs: Monaco, Liechtenstein, Luxembourg, Switzerland and Norway. Ireland’s figure is boosted by profits of foreign companies booked there.','There is still a west–east gap, though Poland and the Baltic states have caught up fast since joining the EU in 2004.','The poorest are Ukraine (devastated by war), Moldova and Kosovo.','About 1 in 5 people in the EU is counted as at risk of poverty or social exclusion; Nordic countries have the lowest inequality.'],
'north-america':[GDPN,'The United States and Canada are among the world’s richest countries; the US has the largest economy and the most billionaires.','The US is more unequal than most other rich countries, with a wide gap between top and bottom incomes.','Haiti is the poorest country in the Americas. Honduras, Nicaragua and Guatemala also have high poverty.','Poverty and violence in Central America push many people to migrate north; money they send home (remittances) can be a fifth or more of GDP in Honduras and El Salvador.','Tourism has made several Caribbean islands, such as the Bahamas, high-income countries.'],
'south-america':[GDPN,'Most South American countries are upper-middle income.','Latin America is one of the most unequal regions in the world: Brazil’s richest 10% earn a very large share of national income.','Uruguay and Chile are the richest per person; Guyana is rising fast thanks to oil found in 2015.','Venezuela was once the richest country per person in South America (1970s), but economic collapse since 2014 drove about 8 million people to leave.','Large informal neighborhoods, like Brazil’s favelas, grew around big cities as rural people moved in.'],

let MAP=null,BB=null,WB=null,mapP=null;
function loadMap(){
  if(mapP)return mapP;
  const urls=['https://cdn.jsdelivr.net/npm/jsvectormap@1.5.3/dist/maps/world.js','https://unpkg.com/jsvectormap@1.5.3/dist/maps/world.js','https://cdn.jsdelivr.net/npm/jsvectormap@1.6.0/dist/maps/world.js'];
  window.jsVectorMap=window.jsVectorMap||{};window.jsVectorMap.addMap=(n,d)=>{if(!MAP&&d&&d.paths)MAP=d};
  mapP=new Promise(res=>{let i=0;const next=()=>{if(MAP)return res(prep());if(i>=urls.length){mapP=null;return res(false)}
    const s=document.createElement('script');s.src=urls[i++];s.onload=()=>MAP?res(prep()):next();s.onerror=next;document.head.appendChild(s)};next()});
  return mapP;
}
function prep(){
  if(BB)return true;
  try{
    const ns='http://www.w3.org/2000/svg',s=document.createElementNS(ns,'svg');s.setAttribute('style','position:absolute;left:-9999px;top:0;width:1000px;height:600px;visibility:hidden');document.body.appendChild(s);
    BB={};let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
    for(const [k,v] of Object.entries(MAP.paths)){const p=document.createElementNS(ns,'path');p.setAttribute('d',v.path);s.appendChild(p);const b=p.getBBox();BB[k]={x:b.x,y:b.y,w:b.width,h:b.height};
      if(k!=='AQ'){x0=Math.min(x0,b.x);y0=Math.min(y0,b.y);x1=Math.max(x1,b.x+b.width);y1=Math.max(y1,b.y+b.height)}}
    s.remove();WB={x:x0,y:y0,w:x1-x0,h:y1-y0};return true;
  }catch(e){return false}
}
const onMap=x=>x.iso&&BB&&BB[x.iso];
function pad(b,f){return{x:b.x-b.w*f,y:b.y-b.h*f,w:b.w*(1+2*f),h:b.h*(1+2*f)}}
function viewFor(scope){
  if(scope==='world')return pad(WB,.02);
  const c=CH.find(z=>z.id===scope);let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9,n=0;
  c.list.forEach(x=>{const b=onMap(x);if(!b||x.iso==='RU'||b.w>WB.w*.3)return;n++;x0=Math.min(x0,b.x);y0=Math.min(y0,b.y);x1=Math.max(x1,b.x+b.w);y1=Math.max(y1,b.y+b.h)});
  return n?pad({x:x0,y:y0,w:x1-x0,h:y1-y0},.05):pad(WB,.02);
}
function focusView(code){
  const b=BB[code],m=Math.max(b.w,b.h*1.6,WB.w*.035)*3.2,cx=b.x+b.w/2,cy=b.y+b.h/2;
  return{x:cx-m/2,y:cy-m/3.2,w:m,h:m/1.6};
}
function drawMap(el,o){
  const inSet=new Set(o.inSet||[]);
  el.innerHTML=`<svg viewBox="0 0 10 10" preserveAspectRatio="xMidYMid meet" role="img" aria-label="World map">${Object.entries(MAP.paths).filter(([k])=>k!=='AQ'||o.showAQ).map(([k,v])=>`<path d="${String(v.path).replace(/[^MLHVCSQTAZmlhvcsqtaz0-9.,\s-]/g,'')}" data-c="${k.replace(/\W/g,'')}"${inSet.has(k)?' class="in"':''}/>`).join('')}<g id="rg"></g></svg><div class="zoom"><button aria-label="Zoom in" data-z=".7">+</button><button aria-label="Zoom out" data-z="1.43">−</button><button aria-label="Reset view" data-z="0" style="font-size:15px">⟲</button></div>${o.help?`<span class="maphelp">${o.help}</span>`:''}`;
  const svg=el.querySelector('svg');let home={...o.view},vb={...o.view};
  const set=v=>{vb={...v};svg.setAttribute('viewBox',`${vb.x} ${vb.y} ${vb.w} ${vb.h}`)};set(vb);
  const zoom=f=>{const nw=Math.min(WB.w*1.2,Math.max(WB.w/60,vb.w*f)),k=nw/vb.w,cx=vb.x+vb.w/2,cy=vb.y+vb.h/2;set({x:cx-vb.w*k/2,y:cy-vb.h*k/2,w:vb.w*k,h:vb.h*k})};
  el.querySelectorAll('[data-z]').forEach(b=>b.onclick=()=>{const z=+b.dataset.z;z?zoom(z):set(home)});
  const pts=new Map();let st=null,moved=false,pin=null;
  const scale=()=>{const r=svg.getBoundingClientRect();return Math.max(vb.w/r.width,vb.h/r.height)};
  svg.addEventListener('pointerdown',e=>{try{svg.setPointerCapture(e.pointerId)}catch(_){}pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===1){st={x:e.clientX,y:e.clientY,v:{...vb},k:scale()};moved=false}else if(pts.size===2){const[a,b]=[...pts.values()];pin={d:Math.hypot(a.x-b.x,a.y-b.y)||1,v:{...vb}};moved=true}});
  svg.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pin&&pts.size===2){const[a,b]=[...pts.values()],d=Math.hypot(a.x-b.x,a.y-b.y)||1;vb={...pin.v};zoom(pin.d/d)}
    else if(st&&pts.size===1){const dx=e.clientX-st.x,dy=e.clientY-st.y;if(Math.hypot(dx,dy)>6)moved=true;if(moved)set({...st.v,x:st.v.x-dx*st.k,y:st.v.y-dy*st.k})}});
  const up=e=>{if(!pts.has(e.pointerId))return;pts.delete(e.pointerId);
    if(!pts.size){if(!moved&&o.on&&e.type==='pointerup'){const t=document.elementFromPoint(e.clientX,e.clientY),p=t&&t.closest&&t.closest('path[data-c]');if(p)o.on(p.dataset.c)}st=null;pin=null}
    else if(pts.size===1){const[a]=[...pts.values()];st={x:a.x,y:a.y,v:{...vb},k:scale()};pin=null}};
  svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
  svg.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY>0?1.15:.87)},{passive:false});
  const ctl={
    mark(code,cls){const p=svg.querySelector(`path[data-c="${code}"]`);if(p)p.classList.add(cls)},
    clear(cls){svg.querySelectorAll('path.'+cls).forEach(p=>p.classList.remove(cls))},
    ring(code){const b=BB[code];if(!b)return;const r=Math.max(b.w,b.h)/2+vb.w*.03;svg.querySelector('#rg').innerHTML=`<circle class="ring" cx="${b.x+b.w/2}" cy="${b.y+b.h/2}" r="${r}"/>`},
    view:v=>{set(v)}};
  return ctl;
}

const MODELS=[
{k:'T',name:'Traditional economy',c:'#8a6a3a',aka:'Based on custom, family and community',
how:'People produce what their parents and grandparents produced — farming, herding, hunting or fishing — and share or trade within the community. Custom answers the big economic questions.',
dec:'Tradition and elders; roles often pass down by family or gender.',
pro:['Strong community ties and shared responsibility','Usually sustainable use of land and resources','Little waste and little inequality inside the group'],
con:['Little growth, so living standards stay low','Hard to cope with drought, disease or outside competition','Few choices about work or goods'],
ex:'No country runs this way today, but traditional economies survive inside many: nomadic herders in Mongolia and the Sahel, subsistence farmers in Papua New Guinea, Indigenous communities in the Amazon and Arctic.'},
{k:'F',name:'Free-market economy',c:'#1f6fb2',aka:'Also called market capitalism or laissez-faire',
how:'Individuals and private companies own businesses and property. Prices are set by supply and demand, and the profit motive and competition decide what gets made. Government mainly protects property, enforces contracts and keeps order.',
dec:'Millions of buyers and sellers through prices — Adam Smith’s “invisible hand.”',
pro:['Strong incentives to work, invent and invest','Wide choice of goods and fast innovation','Has driven most of the world’s growth in living standards over the last two centuries'],
con:['Can produce large gaps between rich and poor','Booms and busts, such as the 1929 crash and the 2008 financial crisis','May neglect things markets don’t price well, like pollution or care for those who can’t work'],
ex:'No country is a pure free market, but these lean closest:',ec:'F'},
{k:'M',name:'Mixed economy',c:'#2f8a57',aka:'Includes the “social market economy” and the Nordic model',
how:'Most businesses are private and markets set most prices, but government plays a big role: it taxes, regulates, provides schools, roads and health care, runs a safety net, and sometimes owns key companies.',
dec:'Markets for most things; elected governments for public services and rules.',
pro:['Keeps market efficiency while softening its hardest edges','Public services and safety nets reduce poverty','Voters can adjust the balance over time'],
con:['Higher taxes and more regulation can slow growth and enterprise','Constant debate over how big government should be','Government programs can become costly and hard to reform'],
ex:'Almost every country today is mixed; the debate is over the mix. The Nordic countries pair free markets with high taxes and generous services, while Germany calls its version a “social market economy.”',ec:'M'},
{k:'S',name:'State-led economy',c:'#b5651d',aka:'Also called state capitalism',
how:'Markets and private firms exist, but the state owns or directs the most important industries — energy, banks, telecoms — and uses them to pursue national goals. Profits often flow into state investment funds.',
dec:'Private firms for much daily business; the state for “commanding heights” industries.',
pro:['Can mobilize huge investment quickly (China’s railways, Gulf cities)','Keeps resource wealth under national control','Can shield key industries from foreign takeover'],
con:['Favors politically connected firms and invites corruption','State firms can be inefficient and protected from competition','Usually comes with limited political freedom'],
ex:'Common where governments control oil or where a ruling party guides growth:',ec:'S'},
{k:'C',name:'Command economy',c:'#b3261e',aka:'Also called a centrally planned economy; the system of communist states',
how:'The government owns land, factories and resources and decides what to produce, how much and at what price, usually in multi-year plans. Private business is banned or tightly limited.',
dec:'Central planners in the government.',
pro:['Can direct resources rapidly toward big goals, like Soviet industrialization or wartime production','Aims for equality, guaranteed jobs and basic services','Little open unemployment'],
con:['Planners can’t match supply to millions of needs, causing shortages and long lines','Weak incentives for quality and innovation','Has repeatedly come with loss of freedom, and in some cases famine (Soviet Union 1932–33, China 1959–61)'],
ex:'Once covered a third of humanity; today only a few remain:',ec:'C'}];
const TIMELINE=[['1776','Adam Smith publishes The Wealth of Nations, the founding book of free-market economics.'],['1848','Karl Marx and Friedrich Engels publish The Communist Manifesto, calling for workers to own the means of production.'],['1917–1928','The Russian Revolution creates the Soviet Union, which launches the first five-year plan, the model for command economies.'],['1930s','The Great Depression leads many democracies, including the US New Deal, toward mixed economies with safety nets.'],['1945–1975','Western Europe builds welfare states; communism spreads to Eastern Europe, China, Cuba and Vietnam.'],['1978','China begins market reforms under Deng Xiaoping; Vietnam follows with Đổi Mới in 1986.'],['1980s','The US, UK and New Zealand cut taxes, regulations and state ownership; many developing countries open their markets.'],['1989–1991','The Berlin Wall falls and the Soviet Union collapses; Eastern Europe switches to market economies.'],['2008','The global financial crisis renews debate over regulating markets.'],['Today','Nearly all countries are mixed economies, with state capitalism (China, Gulf states) as the main alternative model.']];

  <div class="spec">${MODELS.map(m=>`<a href="#m-${m.k}" style="background:${m.c}">${m.name.replace(' economy','')}</a>`).join('')}</div><div class="spec-ax"><span>Custom decides</span><span>Markets decide</span><span>Government decides</span></div></div></section>

  <h2>Capitalism, socialism, communism</h2>

    body=`<div class="facts">${c.facts.map(f=>`<div><b>${f[0]}</b><span>${f[1]}</span></div>`).join('')}</div>
    ${c.sec.map(s=>`<div class="sec"><h3>${s[0]}</h3><ul>${s[1].map(t=>`<li>${t}</li>`).join('')}</ul></div>`).join('')}
    <div class="know"><b>Check your understanding</b><p style="margin:4px 0 12px">Take the lesson quiz, then study the country profiles.</p><div class="row" style="margin:0"><button class="cta" id="lq">Lesson quiz</button><button id="mk">${done?'✓ Marked as read':'Mark lesson read'}</button>${c.list.length?'<button id="gc">Country profiles</button>':''}</div></div>`;

  }
  app.innerHTML=`<section class="band head" style="--cc:${c.color}"><div class="wrap"><button class="back" id="bk">← All chapters</button><h1>${c.name}</h1><p style="margin:6px 0 0;font-size:17px">${c.tag} · ${c.area} · ${c.pop}${c.count!=='0'?' · '+c.count+' countries':''}</p><div class="tabs">${tabs.map(t=>`<button data-t="${t[0]}" aria-pressed="${t[0]===tab}">${t[1]}</button>`).join('')}</div></div></section><section class="band" style="--cc:${c.color}"><div class="wrap">${body}</div></section>`;

  if(tab==='lesson'){$('#lq').onclick=()=>startQuiz(id,'overview');$('#mk').onclick=()=>{st.set('les:'+id,true);chapter(id,'lesson')};if($('#gc'))$('#gc').onclick=()=>chapter(id,'countries')}
  if(tab==='countries'){
    const mx=Math.max(...c.list.map(x=>x.p));
    const draw=q=>{q=q.toLowerCase();const l=c.list.filter(x=>!q||[x.n,x.c,x.r,x.g,x.e,x.h,x.na,x.w,x.ag,ESYS[x.es],x.en].join(' ').toLowerCase().includes(q));
      $('#cl').innerHTML=l.length?l.map(x=>`<details class="c"><summary><b>${x.n}</b><span class="bar" title="Population"><i style="width:${Math.max(2,Math.sqrt(x.p/mx)*100)}%"></i></span><small>${x.c} · ${fmtP(x.p)}</small></summary>${card(x)}</details>`).join(''):'<p class="note">No countries match that search.</p>'};

      const ctl=drawMap(el,{view:viewFor(id),inSet:c.list.map(x=>x.iso).filter(Boolean),on:code=>{
        ctl.clear('sel');ctl.mark(code,'sel');const x=BYISO[code],nm=x?x.n:String((MAP.paths[code]&&MAP.paths[code].name)||code).replace(/[<>&"]/g,'');

      }});
    });
  }
  scrollTo(0,0);
}

function opts(right,pool){const o=[...new Set(sh(pool).filter(v=>v!==right))].slice(0,3);return sh([right,...o])}
function gen(scope,mode){
  const c=CH.find(x=>x.id===scope);const pool=scope==='world'?ALL:c.list.map(x=>({...x,cont:scope}));
  const near=x=>{const s=pool.filter(y=>y.cont===x.cont&&y.n!==x.n);return s.length>=3?s:pool.filter(y=>y.n!==x.n)};
  const T={
    capital(){const x=pick(pool);return{clue:'Capital',q:`What is the capital of ${x.n}?`,a:x.c,o:opts(x.c,near(x).map(y=>y.c)),x}},
    country(){const x=pick(pool);return{clue:'Country',q:`${x.c} is the capital of which country?`,a:x.n,o:opts(x.n,near(x).map(y=>y.n)),x}},
    economy(){const x=pick(pool);return{clue:'Economy — which country?',q:mask(x.e,x.n),a:x.n,o:opts(x.n,near(x).map(y=>y.n)),x}},
    mapname(){const mp=pool.filter(onMap);if(!mp.length)return T.capital();const x=pick(mp);return{clue:'Map',q:'Which country is highlighted?',a:x.n,o:opts(x.n,near(x).map(y=>y.n)),x,map:{kind:'name',code:x.iso}}},
    maptap(){const v=viewFor(scope),mp=pool.filter(y=>{const b=onMap(y);return b&&Math.max(b.w,b.h)>=v.w*(scope==='world'?.02:.025)});if(!mp.length)return T.mapname();const x=pick(mp);return{clue:'Map',q:`Tap ${x.n} on the map`,a:x.n,x,map:{kind:'tap',code:x.iso}}},
    geo(){const x=pick(pool);return{clue:'Geography — which country?',q:mask(x.h,x.n),a:x.n,o:opts(x.n,near(x).map(y=>y.n)),x}},
    people(){
      const k=pick(['pop','pop','rel','mon']);
      if(k==='mon'){const m=pool.filter(x=>isMon(x.g)),n=pool.filter(x=>notMon(x.g));if(m.length&&n.length>=3){const x=pick(m);return{clue:'Government',q:'Which of these countries is a monarchy?',a:x.n,o:sh([x.n,...sh(n).slice(0,3).map(y=>y.n)]),x}}}
      if(k!=='pop'){const cats=Object.keys(RL).filter(r=>pool.some(x=>x.rc===r)&&pool.filter(x=>x.rc!==r&&x.rc!=='X').length>=3);if(cats.length){const r=pick(cats),x=pick(pool.filter(y=>y.rc===r));return{clue:'Religion',q:`Which of these countries is ${RL[r]}?`,a:x.n,o:sh([x.n,...sh(pool.filter(y=>y.rc!==r&&y.rc!=='X')).slice(0,3).map(y=>y.n)]),x}}}
      for(let t=0;t<40;t++){const s=sh(pool).slice(0,4).sort((a,b)=>b.p-a.p);if(s.length<4)break;if(s[0].p>=s[1].p*1.3)return{clue:'Population',q:'Which of these countries has the largest population?',a:s[0].n,o:sh(s.map(y=>y.n)),x:s[0],extra:s.map(y=>`${y.n}: ${fmtP(y.p)}`).join(' · ')}}
      return T.capital();
    },
    animals(){
      const cs=scope==='world'?CH:[c],last=v=>v.toLowerCase().replace(/[^a-z\- ]/g,'').split(' ').pop().replace(/s$/,'');
      const nat=pool.filter(x=>x.na);
      if(nat.length&&Math.random()<.55){
        const x=pick(nat),lw=last(x.na),wl=(x.w+' '+x.na).toLowerCase();
        const bad=v=>last(v)===lw||wl.includes(last(v));
        const cand=[...new Set(pool.filter(y=>y.na).map(y=>y.na))].filter(v=>!bad(v));
        const more=[...new Set(ALL.filter(y=>y.na).map(y=>y.na))].filter(v=>!bad(v)&&!cand.includes(v));
        const ds=sh(cand).concat(sh(more)).filter((v,i,a)=>a.findIndex(z=>last(z)===last(v))===i).slice(0,3);
        const uniq=ALL.filter(y=>y.na===x.na).length===1;
        if(uniq&&Math.random()<.5){const others=near(x).filter(y=>y.na!==x.na&&!(y.w||'').toLowerCase().includes(lw));if(others.length>=3)return{clue:'Animals',q:`Which country’s national animal is the ${x.na}?`,a:x.n,o:sh([x.n,...sh(others).slice(0,3).map(y=>y.n)]),x}}
        if(ds.length===3)return{clue:'Animals',q:`What is the national animal of ${x.n}?`,a:x.na,o:sh([x.na,...ds]),x};
      }
      const cc=pick(cs.filter(z=>z.aq)),z=pick(cc.aq),hit=ALL.find(y=>y.n===z[1]);
      return{clue:cc.name+' wildlife',q:z[0],a:z[1],o:sh([z[1],...z[2]]),x:hit};
    },
    agri(){
      const cs=scope==='world'?CH:[c];
      const sup=pool.filter(x=>/world’s|two-thirds|most of the world|EU’s top|Africa’s top|first domesticated/i.test(x.ag));
      if(sup.length&&Math.random()<.4){const x=pick(sup);return{clue:'Agriculture — which country?',q:mask(x.ag,x.n),a:x.n,o:opts(x.n,near(x).map(y=>y.n)),x}}
      const cc=pick(cs.filter(z=>z.fq)),z=pick(cc.fq),hit=ALL.find(y=>y.n===z[1]);
      return{clue:cc.name+' agriculture',q:z[0],a:z[1],o:sh([z[1],...z[2]]),x:hit};
    },
    wealth(){
      const cs=(scope==='world'?CH:[c]).filter(z=>z.rq),gp=pool.filter(x=>x.gdp&&!GEST.has(x.n));
      if(gp.length>=4&&Math.random()<.6){
        const rich=Math.random()<.5;
        for(let t=0;t<40;t++){const s4=sh(gp).slice(0,4).sort((a,b)=>b.gdp-a.gdp);const [a,b2]=rich?[s4[0],s4[1]]:[s4[3],s4[2]];
          if(rich?a.gdp>=b2.gdp*1.4:b2.gdp>=a.gdp*1.4)return{clue:'Wealth & poverty',q:`Which of these countries is ${rich?'richest':'poorest'} per person (GDP per person)?`,a:a.n,o:sh(s4.map(y=>y.n)),x:a,extra:s4.map(y=>`${y.n}: ${money$(y.gdp)}`).join(' · ')}}
      }
      const cc=pick(cs),z=pick(cc.rq),hit=ALL.find(y=>y.n===z[1]);
      return{clue:cc.name+' wealth & poverty',q:z[0],a:z[1],o:sh([z[1],...z[2]]),x:hit};
    },
    econ(){
      if(Math.random()<.6){
        const far={C:['M','F'],S:['M','F'],F:['S','C'],X:['F','M']},ks=Object.keys(far);
        for(let t=0;t<20;t++){
          const k=pick(ks),hits=pool.filter(y=>y.es===k);if(!hits.length)continue;
          const x=pick(hits);let ds=near(x).filter(y=>far[k].includes(y.es));if(ds.length<3)ds=ALL.filter(y=>far[k].includes(y.es)&&y.n!==x.n);
          const lab={C:'a command economy',S:'a state-led economy (state capitalism)',F:'one of the most free-market economies',X:'an economy in crisis or transition'}[k];
          return{clue:'Economic systems',q:`Which of these countries has ${lab}?`,a:x.n,o:sh([x.n,...sh(ds).slice(0,3).map(y=>y.n)]),x};
        }
      }
      const z=pick(ECQ),hit=ALL.find(y=>y.n===z[1]);
      return{clue:'Economic systems',q:z[0],a:z[1],o:sh([z[1],...z[2]]),x:hit};
    },
    overview(){const cs=scope==='world'?CH:[c];const cc=pick(cs);const z=pick(cc.quiz);return{clue:cc.name+' lesson',q:z[0],a:z[1],o:sh([z[1],...z[2]])}}
  };
  const n=10,out=[],seen=new Set();
  if(mode==='overview'&&scope!=='world'){return sh(c.quiz).map(z=>({clue:c.name+' lesson',q:z[0],a:z[1],o:sh([z[1],...z[2]])}))}
  for(let i=0;i<60&&out.length<n;i++){const m=mode==='mixed'?pick(['capital','country','economy','geo','people','overview','animals','agri','wealth','econ'].concat(BB?['mapname']:[])):mode;const qq=T[m]();if(seen.has(qq.q+qq.a))continue;seen.add(qq.q+qq.a);out.push(qq)}
  return out;
}

function startQuiz(scope,mode){
  const c=CH.find(x=>x.id===scope);const color=c?c.color:'#0b5f86';const title=(c?c.name:'World')+' · '+MODES.find(m=>m[0]===mode)[1];
  const back=()=>scope==='world'?home():chapter(scope,'quiz');
  if(mode.startsWith('map')&&!BB){
    app.innerHTML=`<section class="band" style="--cc:${color}"><div class="qbox"><button id="qx">← Back</button><div class="mapbox" style="margin-top:16px"><div class="msg" id="lm">Loading the world map…</div></div></div></section>`;
    $('#qx').onclick=back;
    loadMap().then(ok=>{if(!$('#lm'))return;if(ok)startQuiz(scope,mode);else{$('#lm').innerHTML='The map couldn’t load. It needs an internet connection.<br><button class="cta" id="rt" style="margin-top:12px">Try again</button>';$('#rt').onclick=()=>startQuiz(scope,mode)}});
    return;
  }
  const qs=gen(scope,mode);let i=0,score=0;const missed=[];
  const show=()=>{
    const q=qs[i];let ctl=null,locked=false;
    app.innerHTML=`<section class="band" style="--cc:${color}"><div class="qbox"><div class="row" style="margin:0;justify-content:space-between"><button id="qx">← Leave quiz</button><span class="note">${title} · ${i+1} of ${qs.length} · Score ${score}</span></div><div class="meter"><i style="width:${i/qs.length*100}%"></i></div><p class="clue">${q.clue}</p><p class="q">${q.q}</p>${q.map?'<div class="mapbox" id="qm"></div>':''}${q.o?`<div class="opts">${q.o.map((o,k)=>`<button data-k="${k}">${o}</button>`).join('')}</div>`:''}<div id="fb"></div></div></section>`;
    $('#qx').onclick=back;
    const answer=(ok,btn,code)=>{
      if(locked)return;locked=true;if(ok)score++;else missed.push(q);
      app.querySelectorAll('[data-k]').forEach(z=>{z.disabled=true;if(q.o[+z.dataset.k]===q.a)z.classList.add('right')});if(btn&&!ok)btn.classList.add('wrong');
      if(ctl&&q.map.kind==='tap'){ctl.mark(q.map.code,'ok');if(!ok&&code){ctl.mark(code,'no')}if(!ok){ctl.view(focusView(q.map.code));ctl.ring(q.map.code)}}
      const tapped=code&&!ok?(BYISO[code]?BYISO[code].n:(MAP.paths[code]&&String(MAP.paths[code].name).replace(/[<>&"]/g,''))||''):'';
      $('#fb').innerHTML=`<div class="fb"><b style="color:${ok?'var(--ok)':'var(--bad)'}">${ok?'Correct!':(tapped?'That was '+tapped+'. ':'')+'The answer is '+q.a+(q.map&&q.map.kind==='tap'?' (shown in green).':'.')}</b>${q.extra?`<p style="margin:6px 0 0">${q.extra}</p>`:''}${q.x?`<h3 style="margin-top:12px">${q.x.n}</h3>${card(q.x)}`:''}</div><div class="row"><button class="cta" id="nx">${i+1<qs.length?'Next question':'See results'}</button></div>`;
      $('#nx').onclick=()=>{i++;i<qs.length?show():done()};if(!q.map)$('#nx').focus();
    };
    if(q.map){
      const tap=q.map.kind==='tap';
      ctl=drawMap($('#qm'),{view:tap?viewFor(scope):focusView(q.map.code),help:tap?'Drag · pinch to zoom':'',on:tap?code=>answer(code===q.map.code,null,code):null});
      if(!tap){ctl.mark(q.map.code,'hi');const b=BB[q.map.code];if(Math.max(b.w,b.h)<focusView(q.map.code).w*.12)ctl.ring(q.map.code)}
    }
    app.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>answer(q.o[+b.dataset.k]===q.a,b));
  };
  const done=()=>{
    const pct=Math.round(score/qs.length*100),k='best:'+scope+':'+mode,best=Math.max(pct,st.get(k,0));st.set(k,best);
    app.innerHTML=`<section class="band" style="--cc:${color}"><div class="qbox"><p class="clue">${title}</p><div class="big">${pct}%</div><p style="font-size:18px;margin:4px 0">${score} of ${qs.length} correct · best ${best}%</p><p class="note">${pct>=90?'Excellent — you know this material.':pct>=70?'Solid work. Review the misses below and try again.':'Keep at it — read the profiles, then retake the quiz.'}</p>
    ${missed.length?`<h3 style="margin-top:22px">Review</h3>${missed.map(q=>`<div class="miss"><div class="note">${q.clue}</div><div>${q.q}</div><b>${q.a}</b></div>`).join('')}`:''}
    <div class="row"><button class="cta" id="ag">New ${MODES.find(m=>m[0]===mode)[1]} quiz</button><button id="bq">${scope==='world'?'Home':'Back to chapter'}</button></div></div></section>`;
    $('#ag').onclick=()=>startQuiz(scope,mode);$('#bq').onclick=back;scrollTo(0,0);
  };
  show();scrollTo(0,0);
}
home();
}
</script>
